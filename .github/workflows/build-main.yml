name: Build Main (Android Debug APK & Windows Portable ZIP)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-and-windows-xmb:
    name: Android Debug APK & XMB Windows Portable ZIP (Linux Host)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Ensure executable permissions on scripts
        run: chmod +x gradlew scripts/*.sh scripts/xmb/*.sh

      - name: Validate Compose string resources
        run: python3 scripts/check_compose_resource_escapes.py

      - name: Set up Eclipse Temurin JDK 25 (Adoptium)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK platforms (37.1), build-tools, NDK, and CMake
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "ANDROID_SDK_ROOT and ANDROID_HOME are unset"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "build-tools;36.0.0" \
            "platforms;android-35" \
            "platforms;android-37" \
            "platforms;android-37.1" \
            "ndk;30.0.16248370" \
            "cmake;4.1.2"

      - name: Cache Windows JRE & Skiko runtime downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/xmb-windows
          key: xmb-windows-runtime-jdk-25.0.5+8-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build Android Debug APK
        run: |
          ./gradlew :androidApp:assembleDebug \
            --no-configuration-cache \
            --console=plain
          APP_VERSION="$(sed -n 's/^appVersion=//p' gradle.properties)"
          python3 scripts/collect_android_apks.py \
            androidApp/build/outputs/apk/debug \
            dist \
            "$APP_VERSION" \
            debug

      - name: Build Windows x64 Portable ZIP (scripts/xmb/package_windows_portable.sh)
        run: |
          ./scripts/xmb/package_windows_portable.sh dist/Metrolist-XMB-windows-x64.zip

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-xmb-main-android-debug-apk
          path: dist/metrolist-android-*-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows Portable ZIP (XMB .cmd bundle)
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-xmb-main-windows-x64-portable-zip
          path: dist/Metrolist-XMB-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  windows-native-exe:
    name: Windows x64 Native Launcher Portable ZIP (Metrolist.exe + WebView2 Helper)
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Eclipse Temurin JDK 25 (Adoptium)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up .NET 10 SDK (for metro-wv2-helper)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: metro-wv2-helper/global.json

      - name: Build and stage metro-wv2-helper.exe
        shell: pwsh
        run: |
          dotnet publish metro-wv2-helper/metro-wv2-helper.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:DebugType=None `
            /p:DebugSymbols=false `
            /p:PublishReadyToRun=true

          $dest = "desktopApp/src/desktopMain/resources/windows"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force `
            "metro-wv2-helper/bin/Release/net10.0-windows/win-x64/publish/metro-wv2-helper.exe" `
            "$dest/metro-wv2-helper.exe"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Assemble Native Windows Portable ZIP
        shell: pwsh
        run: |
          ./gradlew.bat :desktopApp:assembleWindowsRelease `
            -Pmetrolist.debug=false `
            --no-configuration-cache `
            --console=plain

      - name: Upload Windows Native Portable ZIP (Metrolist.exe)
        uses: actions/upload-artifact@v4
        with:
          name: metrolist-xmb-main-windows-native-exe-zip
          path: dist/Metrolist-Desktop-Windows.zip
          if-no-files-found: error
          retention-days: 14
